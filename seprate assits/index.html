<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Fourth Kind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HERO SECTION (VERSION 1) -->
  <section class="hero" id="hero">

    <!-- TOP NAVIGATION -->
    <header class="navbar">
      <div class="nav-container">
        <a href="#" class="brand-title">
          <img src="Vector.png" alt="The Fourth Kind Logo" class="brand-logo-img" />
          <span>THE FOURTH KIND</span>
        </a>
        <nav class="nav-menu">
          <a href="../shop/index.html" class="nav-item">Shop</a>
          <a href="../contact/index.html" class="nav-item">Contact</a>
        </nav>
      </div>
    </header>

    <!-- HORIZON & SPACE BACKGROUND STAGE -->
    <div class="stage-container">
      
      <!-- Subtle Starfield / Cosmic Dust Particles -->
      <canvas id="starfield"></canvas>

      <!-- Center Radial Flare -->
      <div class="flare-radial"></div>

      <!-- Eclipse Atmospheric Gradient -->
      <div class="eclipse-atmosphere"></div>

      <!-- Celestial Horizon Curve Rim -->
      <div class="horizon-rim"></div>

      <!-- Side Vignette Fades -->
      <div class="side-fades">
        <div class="fade-left"></div>
        <div class="fade-right"></div>
      </div>

    </div>

  </section>

  <!-- STARFIELD ENGINE -->
  <script src="particles.js"></script>
</body>
</html>
