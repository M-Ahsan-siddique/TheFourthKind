<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Fourth Kind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HERO SECTION (VERSION 1) -->
  <section class="hero" id="hero">

    <!-- TOP NAVIGATION -->
    <header class="navbar">
      <div class="nav-container">
        <a href="#" class="brand-title">THE FOURTH KIND</a>
        <nav class="nav-menu">
          <a href="../shop/index.html" class="nav-item">Shop</a>
          <a href="../contact/index.html" class="nav-item">Contact</a>
        </nav>
      </div>
    </header>

    <!-- HORIZON & SPACE BACKGROUND STAGE -->
    <div class="stage-container">
      
      <!-- Subtle Starfield / Cosmic Dust Particles -->
      <canvas id="starfield"></canvas>

      <!-- Center Radial Flare -->
      <div class="flare-radial"></div>

      <!-- Eclipse Atmospheric Gradient -->
      <div class="eclipse-atmosphere"></div>

      <!-- Celestial Horizon Curve Rim -->
      <div class="horizon-rim"></div>

      <!-- Side Vignette Fades -->
      <div class="side-fades">
        <div class="fade-left"></div>
        <div class="fade-right"></div>
      </div>

    </div>

    <!-- BOTTOM FLOATING SWITCHER & BADGE -->
    <div class="bottom-bar">
      <div class="variant-pill">
        <a href="../landing-v2/index.html" class="pill-action">
          <span class="pill-icon">🪐</span>
          <span>View V2 (Planet Video)</span>
        </a>
        <span class="pill-divider">|</span>
        <a href="../compare/index.html" class="pill-action">
          <span class="pill-icon">⚡</span>
          <span>Compare</span>
        </a>
      </div>

      <div class="netlify-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.92 9.06L12.56 4.7a1.5 1.5 0 0 0-2.12 0L6.08 9.06a1.5 1.5 0 0 0 0 2.12l4.36 4.36a1.5 1.5 0 0 0 2.12 0l4.36-4.36a1.5 1.5 0 0 0 0-2.12z" fill="#00C7B7"/>
          <path d="M12 2L3 11l9 9 9-9-9-9z" stroke="#00C7B7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Powered by <strong>Netlify</strong></span>
      </div>
    </div>

  </section>

  <!-- STARFIELD ENGINE -->
  <script src="particles.js"></script>
</body>
</html>
